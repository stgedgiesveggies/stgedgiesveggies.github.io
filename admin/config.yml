backend:
  name: github
  repo: jasunde/edgies-veggies
  branch: staging
  auth_type: pkce
  app_id: Ov23libxhfLgXMCAHyQx

media_folder: "assets/images/posts"
public_folder: "/assets/images/posts"

site_url: "https://edgiesveggies.com"
display_url: "https://edgiesveggies.com"
logo_url: "/assets/images/lettuce-cropped-web.jpeg"

publish_mode: simple

collections:
  - name: "posts"
    label: "Farm Updates"
    label_singular: "Farm Update"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{year}}/{{month}}/{{day}}/{{slug}}.html"
    editor:
      preview: false
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: 'e.g. "Market Update — May 3rd: Salad Mix, Radishes, and Baby Spinach"'

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "MMMM D, YYYY"
        time_format: false
        default: "{{now}}"

      - label: "Cover Photo"
        name: "cover_image"
        widget: "image"
        required: false
        hint: "A photo for the top of the post and social sharing. Upload from your phone or computer."
        media_library:
          config:
            multiple: false

      - label: "Post Content"
        name: "body"
        widget: "markdown"
        buttons:
          - bold
          - italic
          - bulleted-list
          - numbered-list
          - link
        editor_components:
          - image
        hint: "Write your update here. Use the toolbar to add bold text, lists, or more photos."

      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "post"

  - name: "events"
    label: "Events"
    label_singular: "Event"
    folder: "_events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: 'e.g. "Edgie''s Veggies at St. Paul Farmers'' Market"'

      - label: "Start Date & Time"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ss"
        date_format: "MMMM D, YYYY"
        time_format: "h:mm A"
        default: "{{now}}"
        hint: "All times are Central Time."

      - label: "End Date & Time"
        name: "end_date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ss"
        date_format: "MMMM D, YYYY"
        time_format: "h:mm A"
        hint: "All times are Central Time."

      - label: "Location"
        name: "location"
        widget: "string"
        required: false
        hint: "Address or venue name."

      - label: "Notes"
        name: "description"
        widget: "text"
        required: false
        hint: "Optional details shown on the website and included in the calendar event."

      - label: "Recurring Event?"
        name: "recurring"
        widget: "boolean"
        default: false

      - label: "Repeat Frequency"
        name: "frequency"
        widget: "select"
        options:
          - { label: "Weekly", value: "weekly" }
          - { label: "Every 2 Weeks", value: "biweekly" }
          - { label: "Monthly", value: "monthly" }
        required: false
        hint: "Only used if Recurring Event is checked."

      - label: "Repeat Until"
        name: "recurrence_end"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ss"
        date_format: "MMMM D, YYYY"
        time_format: "h:mm A"
        required: false
        hint: "Leave blank to repeat indefinitely."

      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "ical"
