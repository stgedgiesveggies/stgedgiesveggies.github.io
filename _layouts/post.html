---
layout: default
---
<div style="max-width: 720px; margin: 2rem auto 4rem;">
  <article class="uk-article">

    {% if page.cover_image %}
    <div class="uk-margin-medium-bottom">
      <img src="{{ page.cover_image | relative_url }}"
           alt="{{ page.title }}"
           class="uk-width-1-1"
           style="max-height: 480px; object-fit: cover; border-radius: 4px;">
    </div>
    {% endif %}

    <h1 class="uk-article-title">{{ page.title }}</h1>

    <p class="uk-article-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
    </p>

    <div class="uk-margin-medium-top">
      {{ content }}
    </div>

    <hr class="uk-divider-small uk-margin-large-top">
    <div class="uk-flex uk-flex-between uk-flex-middle" style="flex-wrap: wrap; gap: 0.5rem;">
      <a href="{{ '/' | relative_url }}" class="uk-button uk-button-text">&larr; Home</a>
      <div class="uk-flex" style="gap: 0.5rem; flex-wrap: wrap;">
        {% if page.previous %}
        <a href="{{ page.previous.url | relative_url }}" class="uk-button uk-button-default">&larr; Previous</a>
        {% endif %}
        {% if page.next %}
        <a href="{{ page.next.url | relative_url }}" class="uk-button uk-button-default">Next &rarr;</a>
        {% endif %}
        <a href="{{ '/updates/' | relative_url }}" class="uk-button uk-button-default">All Updates</a>
      </div>
    </div>

  </article>
</div>
