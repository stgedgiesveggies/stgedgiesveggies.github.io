<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    {% if page.cover_image %}
    <meta property="og:type" content="article">
    <meta property="og:image" content="{{ page.cover_image | absolute_url }}">
    {% else %}
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ '/assets/images/lettuce-cropped-web-1500.webp' | absolute_url }}">
    {% endif %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;700;900&display=swap" rel="stylesheet">
    

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
    <script src="{{ '/assets/js/uikit.min.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/uikit-icons.min.js' | relative_url }}" defer></script>

</head>
